<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacnotan BEE-Alert — Barangay Official Sign Up</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <main class="auth-main">
    <div class="auth-card auth-card--wide">

      <header class="auth-card__header">
        <div class="auth-card__logo" aria-hidden="true">
          <img src="src/assets/logo.png" alt="BEE-Alert logo" width="56" height="56"
               style="border-radius:50%;object-fit:cover;background:#fff;padding:4px;" />
        </div>
        <h1 class="auth-card__title">Bacnotan BEE-Alert</h1>
        <p class="auth-card__subtitle">Barangay Official Portal</p>
      </header>

      <div class="auth-card__body">
        <h2 class="auth-card__welcome">Create Account</h2>
        <p class="auth-card__hint">Fill in your details to register as a barangay official. Your account will be reviewed before activation.</p>

        <div id="auth-error" class="form-error form-error--block" role="alert" aria-live="polite" hidden></div>
        <div id="auth-success" class="form-success form-success--block" role="status" aria-live="polite" hidden></div>

        <form id="register-form" novalidate>

          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="name-input">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input class="form-input" type="text" id="name-input" name="name"
                     autocomplete="name" placeholder="Juan Dela Cruz"
                     aria-describedby="name-error" aria-required="true" />
            </div>
            <span class="form-error" id="name-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email-input">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input class="form-input" type="email" id="email-input" name="email"
                     autocomplete="email" placeholder="you@example.com"
                     aria-describedby="email-error" aria-required="true" />
            </div>
            <span class="form-error" id="email-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Mobile Number -->
          <div class="form-group">
            <label class="form-label" for="phone-input">Mobile Number</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </span>
              <input class="form-input" type="tel" id="phone-input" name="phone"
                     autocomplete="tel" placeholder="09XXXXXXXXX"
                     aria-describedby="phone-error" aria-required="true" />
            </div>
            <span class="form-error" id="phone-error" role="alert" aria-live="polite" hidden></span>
          </div>


          <!-- Valid ID Upload -->
          <div class='form-group'>
            <label class='form-label' for='id-upload'>Valid ID <span style='color:red'>*</span></label>
            <div class='id-upload-zone' id='id-upload-zone' tabindex='0' role='button' aria-label='Upload valid ID'>
              <input type='file' id='id-upload' accept='image/*' style='display:none' aria-hidden='true' />
              <div id='id-upload-preview' class='id-upload-preview'>
                <svg width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'>
                  <path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/>
                  <circle cx='12' cy='13' r='4'/>
                </svg>
                <p class='id-upload-text'>Click or drag to upload your Valid ID</p>
                <p class='id-upload-hint'>JPG, PNG &mdash; required</p>
              </div>
            </div>
            <span class='form-error' id='id-error' role='alert' aria-live='polite' hidden></span>
          </div>

          <!-- Barangay -->
          <div class="form-group">
            <label class="form-label" for="barangay-input">Barangay</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </span>
              <select class="form-input" id="barangay-input" name="barangay"
                      aria-describedby="barangay-error" aria-required="true" style="cursor:pointer;">
                <option value="">Select your barangay</option>
                <option>Agtipal</option>
                <option>Arosip</option>
                <option>Bacqui</option>
                <option>Bacsil</option>
                <option>Bagutot</option>
                <option>Ballogo</option>
                <option>Baroro</option>
                <option>Bitalag</option>
                <option>Bulala</option>
                <option>Burayoc</option>
                <option>Bussaoit</option>
                <option>Cabaroan</option>
                <option>Cabarsican</option>
                <option>Cabugao</option>
                <option>Calautit</option>
                <option>Carcarmay</option>
                <option>Casiaman</option>
                <option>Galongen</option>
                <option>Guinabang</option>
                <option>Legleg</option>
                <option>Lisqueb</option>
                <option>Mabanengbeng 1st</option>
                <option>Mabanengbeng 2nd</option>
                <option>Maragayap</option>
                <option>Nangalisan</option>
                <option>Nagatiran</option>
                <option>Nagsaraboan</option>
                <option>Nagsimbaanan</option>
                <option>Narra</option>
                <option>Ortega</option>
                <option>Paagan</option>
                <option>Pandan</option>
                <option>Pang-pang</option>
                <option>Poblacion</option>
                <option>Quirino</option>
                <option>Raois</option>
                <option>Salincob</option>
                <option>San Martin</option>
                <option>Santa Cruz</option>
                <option>Santa rita</option>
                <option>Sapilang</option>
                <option>Sayoan</option>
                <option>Sipulo</option>
                <option>Tammocalao</option>
                <option>Ubbog</option>
                <option>Oya-oy</option>
                <option>Zaragoza</option>

              </select>
            </div>
            <span class="form-error" id="barangay-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password-input">Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input class="form-input form-input--has-end-icon" type="password"
                     id="password-input" name="password"
                     autocomplete="new-password" placeholder="At least 6 characters"
                     aria-describedby="password-error" aria-required="true" />
              <button type="button" class="input-end-btn" id="toggle-password" aria-label="Show password">
                <svg id="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="form-error" id="password-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm-input">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input class="form-input" type="password" id="confirm-input" name="confirm"
                     autocomplete="new-password" placeholder="Re-enter your password"
                     aria-describedby="confirm-error" aria-required="true" />
            </div>
            <span class="form-error" id="confirm-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <button class="btn btn--primary btn--full" type="submit" id="register-btn">
            Create Account
          </button>

        </form>

        <p class="auth-card__footer-link">
          Already have an account? <a href="/index.html" class="auth-link">Sign In</a>
        </p>
      </div>
    </div>
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
    <div class="spinner" role="status"><span class="sr-only">Loading&hellip;</span></div>
  </div>

  <script type="module" src="src/auth/register.js"></script>
</body>
</html>
